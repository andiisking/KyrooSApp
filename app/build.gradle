plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.kyroos.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.kyroos.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // 1. Core Kotlin tetap diperlukan
    implementation 'androidx.core:core-ktx:1.12.0'
    
    // 2. HAPUS 'androidx.appcompat:appcompat:1.6.1' karena duplikat dengan RikkaX
    // Cukup gunakan RikkaX AppCompat saja:
    implementation 'dev.rikka.rikkax.appcompat:appcompat:1.6.1'
    implementation 'dev.rikka.rikkax.core:core:1.4.1'
    
    // 3. Material Components diperlukan untuk tema visual
    implementation 'com.google.android.material:material:1.10.0'
    
    // 4. Library pendukung lainnya (Lifecycle, Conscrypt, BouncyCastle, Coroutines)
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.6.2'
    implementation 'org.conscrypt:conscrypt-android:2.5.2'
    implementation 'org.bouncycastle:bcprov-jdk15to18:1.70'
    implementation 'org.bouncycastle:bcpkix-jdk15to18:1.70'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}




