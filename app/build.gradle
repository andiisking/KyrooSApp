plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.kyroos.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.kyroos.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    
    // 1. Wajib untuk SSL/TLS ADB (Conscrypt)
    implementation 'org.conscrypt:conscrypt-android:2.5.2'
    
    // 2. Wajib untuk Kriptografi & RSA (BouncyCastle Provider)
    implementation 'org.bouncycastle:bcprov-jdk15to18:1.70'
    
    // 3. WAJIB DITAMBAHKAN: Untuk X509v3CertificateBuilder (BouncyCastle PKIX)
    implementation 'org.bouncycastle:bcpkix-jdk15to18:1.70'
    
    // 4. Untuk eksekusi socket di background (Coroutines)
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // 5. Lifecycle untuk Observer di Mdns/Service
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
}


