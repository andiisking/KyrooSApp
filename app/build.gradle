plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.kyroos.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.kyroos.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    kotlinOptions {
        jvmTarget = '17'
    }
    
    // Tambahkan packagingOptions untuk menghindari konflik BouncyCastle
    packagingOptions {
        pickFirst '**/BCKEY.DSA'
        pickFirst '**/BCKEY.SF'
        pickFirst 'META-INF/BCKEY.DSA'
        pickFirst 'META-INF/BCKEY.SF'
        pickFirst 'META-INF/**.SF'
        pickFirst 'META-INF/**.DSA'
        pickFirst 'META-INF/**.RSA'
    }
}

dependencies {
    // 1. Kotlin Core
    implementation 'androidx.core:core-ktx:1.12.0'
    
    // 2. AppCompat standar
    implementation 'androidx.appcompat:appcompat:1.6.1'
    
    // 3. Material Components
    implementation 'com.google.android.material:material:1.10.0'
    
    // 4. Lifecycle
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.6.2'
    
    // 5. Conscrypt untuk TLS/SSL
    implementation 'org.conscrypt:conscrypt-android:2.5.2'
    
    // 6. BouncyCastle (gunakan versi jdk15to18 untuk Android)
    implementation 'org.bouncycastle:bcprov-jdk15to18:1.78.1'
    implementation 'org.bouncycastle:bcpkix-jdk15to18:1.78.1'
    
    // 7. Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    
    // 8. RIKKA CORE - Library yang dibutuhkan oleh kode Axeron
    implementation 'dev.rikka.rikkax.core:core:1.4.1'
    
    // 9. RIKKA SHIZUKU - Untuk akses root/ADB yang lebih baik (opsional, tapi disarankan)
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    
    // 10. AndroidX Annotation
    implementation 'androidx.annotation:annotation:1.7.0'
}