name: KyrooS Build System

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Build KyrooS APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check Dependencies (JitPack)
        run: |
          echo "🔍 Checking JitPack repository..."
          curl -s -I https://jitpack.io | head -n 1

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Get APK Info
        id: apk_info
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
          COMMIT_HASH=$(git rev-parse --short HEAD)
          
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "apk_name=KyrooS-Debug" >> $GITHUB_OUTPUT
          echo "apk_size=$APK_SIZE" >> $GITHUB_OUTPUT
          echo "commit_hash=$COMMIT_HASH" >> $GITHUB_OUTPUT
          
          echo "✅ APK Info:"
          echo "  - Path: $APK_PATH"
          echo "  - Size: $APK_SIZE"
          echo "  - Commit: $COMMIT_HASH"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KyrooS-Debug-${{ steps.apk_info.outputs.commit_hash }}
          path: ${{ steps.apk_info.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload Build Reports (if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-${{ github.sha }}
          path: app/build/reports/
          retention-days: 7

      - name: Build Success Notification
        if: success()
        run: |
          echo "🎉 Build berhasil!"
          echo "📦 APK: KyrooS-Debug"
          echo "📏 Ukuran: ${{ steps.apk_info.outputs.apk_size }}"
          echo "🔗 Download dari Artifacts"

      - name: Build Failure Notification
        if: failure()
        run: |
          echo "❌ Build gagal!"
          echo "📝 Cek build reports di artifacts"