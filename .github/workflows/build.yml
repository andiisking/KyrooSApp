name: KyrooS Build System

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build KyrooS APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generate wrapper if needed
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper
            chmod +x gradlew
          fi

      - name: Build Debug APK
        id: build
        continue-on-error: true  # Biarkan lanjut walau gagal
        run: ./gradlew assembleDebug --stacktrace
        
      # ===== UPLOAD REPORT APAPUN HASILNYA =====
      - name: Upload Build Reports
        if: always()  # Selalu upload, baik sukses maupun gagal
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-${{ github.sha }}
          path: |
            app/build/reports/
            app/build/outputs/logs/
          retention-days: 7
          
      # ===== UPLOAD APK HANYA JIKA SUKSES =====
      - name: Upload APK (if success)
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: KyrooS-Debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          
      # ===== FAILURE NOTIFICATION =====
      - name: Build Status
        if: always()
        run: |
          if [[ "${{ steps.build.outcome }}" == "success" ]]; then
            echo "✅ Build berhasil!"
          else
            echo "❌ Build gagal!"
            echo "📝 Cek build reports di artifacts untuk detail error"
            exit 1
          fi