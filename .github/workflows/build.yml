name: KyrooS Build System

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Build KyrooS APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Check and Generate Gradle Wrapper
        run: |
          if [ ! -f "gradlew" ]; then
            echo "📦 gradlew not found. Generating wrapper..."
            gradle wrapper --gradle-version 8.4
            chmod +x gradlew
          else
            echo "✅ gradlew already exists"
            chmod +x gradlew
          fi

      - name: Check Dependencies (JitPack)
        run: |
          echo "🔍 Checking JitPack repository..."
          curl -s -I https://jitpack.io | head -n 1

      - name: Build Debug APK
        id: build
        run: ./gradlew assembleDebug --stacktrace
        # TIDAK PAKAI continue-on-error, biar gagal dan tercatat

      # ===== UPLOAD REPORT JIKA GAGAL =====
      - name: Upload Build Reports (if failed)
        if: always() && steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-${{ github.sha }}
          path: |
            app/build/reports/
            app/build/outputs/logs/
            app/build/outputs/lint-results-debug.xml
          retention-days: 7
          if-no-files-found: warn

      - name: Upload APK Artifact (if success)
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: KyrooS-Debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Build Status Notification
        if: always()
        run: |
          if [[ "${{ steps.build.outcome }}" == "success" ]]; then
            echo "🎉 Build berhasil!"
          else
            echo "❌ Build gagal!"
            echo "📝 Cek build reports di artifacts"
          fi